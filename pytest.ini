[pytest]
# 將 src 目錄加入到 Python 的搜索路徑，以便 pytest 找到 phoenix_core 模組
pythonpath = src
asyncio_mode = auto

addopts = -n auto --timeout=60
# -n auto: 自動偵測 CPU 核心數並平行化測試。
# --timeout=60: 為每個測試案例設置 60 秒的超時限制。

markers =
    slow: 標記需要較長時間運行的測試 (通常超過幾秒鐘)
    very_slow: 標記需要非常長時間運行的測試 (通常超過一分鐘)
    e2e: 標記端對端測試，這些測試會啟動真實的服務
